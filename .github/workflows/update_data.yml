name: Update Curation Data

on:
  schedule:
    - cron: '0 3 * * *' # Her gece 03:00 UTC'de çalışır
  workflow_dispatch: # Manuel tetikleme seçeneği sunar

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Depoya otomatik push yapabilmek için write izni verilir

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok. Push işlemi atlanıyor."
          else
            git commit -m "Auto: Güncel MCP ve AI Agent Listesi Güncellendi"
            git push
          fi
